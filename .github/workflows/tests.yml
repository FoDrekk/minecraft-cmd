name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and browser tests (${{ matrix.backend }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # db.php tries MySQL first — "the normal XAMPP setup" it's built
        # for — and only falls back to SQLite when that's unreachable.
        # Testing only the fallback let a MySQL-only bug (dbAddColumn()'s
        # column-existence check throwing on a SHOW ... LIKE ? prepare,
        # which MySQL/MariaDB can't do but SQLite's PRAGMA-based check
        # never hit) go undetected in CI. Running both legs closes that
        # gap without dropping the fallback coverage that was already here.
        backend: [mysql, sqlite]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, pdo_mysql, mbstring
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright drives the suites. Cache the browser download so a
      # re-run does not fetch Chromium again.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # db.php's connection settings are hardcoded (host=localhost,
      # user=root, empty password, db=minecraft_cmd — the XAMPP defaults
      # this app targets), so this matches that exactly rather than
      # pointing the app at a differently-configured service. A Docker
      # `services:` container was deliberately not used here: its port
      # is reachable over TCP, but PHP's PDO_MYSQL driver treats a
      # host of "localhost" as "connect via the local Unix socket file"
      # (the same convention the MySQL C client uses), and a container's
      # socket isn't on the runner's filesystem at the path PHP expects
      # — so a real local mysqld is what actually matches what db.php
      # does. Installing it explicitly (rather than assuming ubuntu-latest
      # ships one preinstalled and pre-registered as a systemd service —
      # an assumption that turned out to not hold on the current image)
      # keeps this reproducible regardless of what a given runner image
      # happens to include. Its root user defaults to the auth_socket
      # plugin — switch it to a password-based one so the same
      # empty-password login db.php uses actually works.
      - name: Start MySQL
        if: matrix.backend == 'mysql'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-server
          sudo systemctl start mysql.service
          # GitHub Actions runs `run:` steps under `bash -e`. A bare
          # `cmd && break` as a for-loop statement aborts the whole step
          # the instant the first ping fails (mysqld isn't up yet) rather
          # than retrying — the `if` form is the one that's actually safe
          # under `set -e`.
          ready=0
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL did not accept connections within 30s"
            sudo journalctl -u mysql.service --no-pager | tail -50
            exit 1
          fi
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS minecraft_cmd CHARACTER SET utf8mb4;"

      # tests/run.sh starts its own PHP server unless MCCMD_BASE already
      # points at a running one, and passes that base to every suite.
      - name: Run the test suite
        run: ./tests/run.sh

      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log-${{ matrix.backend }}
          path: /tmp/mccmd-test-server.log
          if-no-files-found: ignore
